<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07090f;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.07);
      --accent: #6366f1;
      --adim: rgba(99, 102, 241, 0.14);
      --text: #dde3ed;
      --muted: #5e6a7e;
      --green: #22c55e;
      --gdim: rgba(34, 197, 94, 0.14);
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 9, 15, 0.95);
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 6px;
    }

    .logo em {
      color: var(--accent);
      font-style: normal;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 99px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      transition: all 0.3s;
    }

    .pill.on {
      background: var(--gdim);
      border-color: rgba(34, 197, 94, 0.3);
      color: var(--green);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    .pill.on .dot {
      background: var(--green);
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    .spacer {
      flex: 1;
    }

    .enc-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 3px 8px;
      border-radius: 4px;
      display: none;
    }

    .enc-badge.on {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: var(--green);
    }

    .enc-badge.off {
      display: block;
      background: rgba(255, 100, 100, 0.08);
      border: 1px solid rgba(255, 100, 100, 0.2);
      color: #f87171;
    }

    .url {
      font-size: 10px;
      font-family: monospace;
      color: var(--muted);
      padding: 4px 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    /* ── FEED ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    main::-webkit-scrollbar {
      width: 3px;
    }

    main::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      animation: pop 0.18s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    .msg-j {
      align-self: flex-start;
      background: var(--adim);
      border: 1px solid rgba(99, 102, 241, 0.18);
      border-bottom-left-radius: 4px;
    }

    .msg-u {
      align-self: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-right-radius: 4px;
    }

    .msg-sys {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      padding: 2px 0;
      background: transparent;
      border: none;
      letter-spacing: 0.3px;
    }

    .lbl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 4px;
    }

    .msg-j .lbl {
      color: var(--accent);
    }

    .msg-u .lbl {
      color: var(--muted);
      text-align: right;
    }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-right-radius: 4px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 82%;
      animation: pop 0.18s ease;
    }

    .fc-icon {
      font-size: 26px;
      flex-shrink: 0;
    }

    .fc-meta {
      flex: 1;
      min-width: 0;
    }

    .fc-lbl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.45;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .fc-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fc-size {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .fc-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 7px;
      overflow: hidden;
    }

    .fc-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.12s linear;
    }

    .fc-status {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      flex-shrink: 0;
      color: var(--muted);
    }

    .fc-status.done {
      color: var(--green);
    }

    .fc-status.err {
      color: #f87171;
    }

    .fc-dl {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .fc-dl:hover {
      opacity: 0.8;
    }

    /* ── FOOTER ── */
    footer {
      flex-shrink: 0;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: rgba(7, 9, 15, 0.95);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #inp {
      flex: 1;
      padding: 11px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    #inp:focus {
      border-color: var(--accent);
    }

    #inp::placeholder {
      color: var(--muted);
    }

    .btn {
      padding: 11px 15px;
      border: none;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:hover {
      opacity: 0.82;
    }

    .btn-send {
      background: var(--accent);
      color: #fff;
    }

    .btn-wake {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      display: none;
    }

    .btn-wake.show {
      display: block;
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .btn-attach {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 11px 13px;
      font-size: 16px;
      line-height: 1;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-attach:hover {
      opacity: 0.82;
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-attach:active {
      transform: scale(0.96);
    }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 11px 13px;
      font-size: 16px;
      line-height: 1;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #mic-btn:hover {
      opacity: 0.82;
      border-color: var(--accent);
      color: var(--accent);
    }

    #mic-btn:active {
      transform: scale(0.96);
    }

    #mic-btn.recording {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.45);
      color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }

    #mic-btn.unsupported {
      opacity: 0.3;
      cursor: not-allowed;
    }

    @keyframes mic-pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: 0.65;
        transform: scale(0.97)
      }
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 7px 18px;
      border-radius: 99px;
      opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── WORK SESSIONS ── */
    .sessions-bar {
      flex-shrink: 0;
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 10px clamp(18px, 4vw, 56px);
      border-bottom: 1px solid var(--border);
      background: rgba(242, 240, 234, .78);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sessions-label {
      color: var(--accent);
      font: 700 10px/1 'Trebuchet MS', sans-serif;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    #session-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: none;
    }

    #session-list::-webkit-scrollbar {
      display: none;
    }

    .session-item,
    .session-action {
      flex-shrink: 0;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      color: var(--ink-soft);
      font: 700 11px 'Trebuchet MS', sans-serif;
      cursor: pointer;
    }

    .session-item:hover,
    .session-action:hover,
    .session-item.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .session-action {
      font-size: 16px;
      line-height: 1;
      padding: 5px 10px;
    }

    #session-form {
      display: none;
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 12px clamp(18px, 4vw, 56px);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      gap: 7px;
      flex-wrap: wrap;
    }

    #session-form.open {
      display: flex;
    }

    #session-form input,
    #session-form textarea {
      min-width: 120px;
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--bg);
      color: var(--text);
      font: 12px Georgia, serif;
      outline: none;
    }

    #session-form textarea {
      flex-basis: 100%;
      resize: vertical;
      min-height: 48px;
    }

    #session-form input:focus,
    #session-form textarea:focus {
      border-color: var(--accent);
    }

    .session-form-buttons {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .session-form-buttons .btn {
      padding: 8px 12px;
    }

    #active-session {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 7px clamp(18px, 4vw, 56px);
      background: var(--adim);
      color: var(--ink-soft);
      font: 11px 'Trebuchet MS', sans-serif;
    }

    #active-session.show {
      display: flex;
    }

    #active-session strong {
      color: var(--accent);
    }

    #exit-session {
      margin-left: auto;
      padding: 5px 9px;
    }

    /* ── OPERATIONS CONSOLE REDESIGN ── */
    :root {
      --bg: #f2f0ea;
      --surface: #fffdf8;
      --border: #d7d2c8;
      --accent: #e2533f;
      --adim: #f9ded7;
      --text: #20252a;
      --muted: #7c817f;
      --green: #24876a;
      --gdim: #dceee7;
      --ink-soft: #525a59;
      --shadow: 0 16px 40px rgba(48, 43, 35, .08);
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
    }

    body {
      background-image: linear-gradient(rgba(32, 37, 42, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32, 37, 42, .035) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    header {
      padding: 18px clamp(18px, 4vw, 56px) 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(242, 240, 234, .9);
      backdrop-filter: blur(14px);
    }

    .logo {
      font-family: 'Trebuchet MS', sans-serif;
      font-size: 17px;
      letter-spacing: 5px;
      color: var(--text);
    }

    .logo em {
      color: var(--accent);
    }

    .pill {
      border-radius: 3px;
      padding: 5px 9px;
      letter-spacing: 1px;
      background: var(--surface);
      border-color: var(--border);
    }

    .pill.on {
      background: var(--gdim);
      border-color: #a8d1c0;
      color: var(--green);
    }

    .dot {
      border-radius: 1px;
    }

    .enc-badge.on {
      background: var(--gdim);
      border-color: #a8d1c0;
      color: var(--green);
    }

    .enc-badge.off {
      background: #f8ddd8;
      border-color: #e7aaa0;
      color: #b13e31;
    }

    .url {
      color: var(--ink-soft);
      background: rgba(255, 253, 248, .7);
      border-color: var(--border);
      border-radius: 3px;
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 34px clamp(18px, 4vw, 56px) 20px;
      gap: 14px;
    }

    main::before {
      content: 'LIVE COMMAND FEED';
      display: block;
      color: var(--accent);
      font: 700 10px/1 'Trebuchet MS', sans-serif;
      letter-spacing: 2px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .msg {
      max-width: min(680px, 88%);
      padding: 14px 17px;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1.6;
      box-shadow: var(--shadow);
    }

    .msg-j {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-bottom-left-radius: 4px;
    }

    .msg-u {
      background: #e7e3da;
      border: 1px solid #d4cfc5;
      border-bottom-right-radius: 4px;
      box-shadow: none;
    }

    .msg-sys {
      color: var(--muted);
      box-shadow: none;
      font-family: 'Trebuchet MS', sans-serif;
    }

    .lbl,
    .fc-lbl {
      font-family: 'Trebuchet MS', sans-serif;
      letter-spacing: 1.5px;
    }

    .msg-j .lbl {
      color: var(--accent);
    }

    .msg-file {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .fc-dl {
      color: var(--accent);
    }

    footer {
      padding: 14px clamp(14px, 4vw, 56px) 18px;
      background: rgba(242, 240, 234, .94);
      border-top: 1px solid var(--border);
    }

    #inp {
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font: 15px Georgia, serif;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .03);
    }

    #inp:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(226, 83, 63, .12);
    }

    #inp::placeholder {
      color: #9b9a94;
    }

    .btn,
    .btn-attach,
    #mic-btn {
      border-radius: 3px;
      font-family: 'Trebuchet MS', sans-serif;
    }

    .btn-send {
      background: var(--accent);
      color: #fffdf8;
      padding-inline: 21px;
    }

    .btn-wake,
    .btn-attach,
    #mic-btn {
      background: var(--surface);
      border-color: var(--border);
      color: var(--ink-soft);
    }

    .btn-wake.show {
      color: var(--accent);
      border-color: #e7aaa0;
      background: var(--adim);
    }

    #mic-btn.recording {
      background: #f8ddd8;
      border-color: #e7aaa0;
      color: #b13e31;
    }

    #toast {
      top: 76px;
      background: var(--gdim);
      border-color: #a8d1c0;
      color: var(--green);
      border-radius: 3px;
      font-family: 'Trebuchet MS', sans-serif;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 16px 13px;
      }

      .url {
        display: none;
      }

      main {
        padding: 24px 16px 16px;
      }

      main::before {
        padding-bottom: 11px;
      }

      .msg {
        max-width: 92%;
      }

      footer {
        padding: 10px;
      }

      .btn-send {
        padding-inline: 14px;
      }
    }

    /* ── COMMAND CENTER ── */
    .mode-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: #e7e3da;
      border: 1px solid var(--border);
      border-radius: 5px;
      margin-left: 8px;
    }

    .mode-btn {
      border: 0;
      border-radius: 3px;
      padding: 7px 11px;
      background: transparent;
      color: var(--muted);
      font: 700 10px 'Trebuchet MS', sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(48, 43, 35, .09);
    }

    .mode-btn:hover {
      color: var(--accent);
    }

    .cloud-panel {
      display: none;
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px clamp(18px, 4vw, 56px);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 253, 248, .72);
    }

    .cloud-panel.show {
      display: block;
    }

    .cloud-heading {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 13px;
    }

    .cloud-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 4px;
      background: var(--adim);
      color: var(--accent);
      font: 700 17px 'Trebuchet MS', sans-serif;
    }

    .cloud-heading h2 {
      font: 700 15px Georgia, serif;
      margin-bottom: 3px;
    }

    .cloud-heading p {
      color: var(--muted);
      font: 12px/1.45 Georgia, serif;
    }

    .cloud-form {
      display: flex;
      gap: 7px;
    }

    .cloud-form input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      color: var(--text);
      font: 13px monospace;
      outline: none;
    }

    .cloud-form input:focus {
      border-color: var(--accent);
    }

    .cloud-note {
      margin-top: 9px;
      color: var(--muted);
      font: 11px 'Trebuchet MS', sans-serif;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 14px clamp(18px, 4vw, 56px) 0;
    }

    .quick-action {
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: rgba(255, 253, 248, .7);
      color: var(--ink-soft);
      font: 700 10px 'Trebuchet MS', sans-serif;
      cursor: pointer;
    }

    .quick-action:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    body.cloud-mode .sessions-bar,
    body.cloud-mode #session-form,
    body.cloud-mode #active-session,
    body.cloud-mode .quick-actions {
      display: none;
    }

    body.cloud-mode #feed::before {
      content: 'CLOUD COMMAND FEED';
    }

    @media (max-width: 600px) {
      .mode-switch {
        margin-left: 0;
        order: 5;
        width: 100%;
      }

      .mode-btn {
        flex: 1;
      }

      header {
        flex-wrap: wrap;
      }

      .cloud-form {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="mode-switch" role="tablist" aria-label="Execution mode">
      <button class="mode-btn active" id="mode-local" type="button" onclick="setMode('local')">PC / LOCAL</button>
      <button class="mode-btn" id="mode-cloud" type="button" onclick="setMode('cloud')">CLOUD</button>
    </div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <section class="cloud-panel" id="cloud-panel">
    <div class="cloud-heading">
      <div class="cloud-mark">↗</div>
      <div>
        <h2>Jarvis Cloud</h2>
        <p>Usa Jarvis dal telefono anche quando il computer non è raggiungibile.</p>
      </div>
    </div>
    <div class="cloud-form">
      <input id="cloud-endpoint" type="url" placeholder="https://api.tuo-dominio.it/v1/command" autocomplete="url">
      <input id="cloud-token" type="password" placeholder="API token" autocomplete="off">
      <button class="btn btn-send" type="button" onclick="connectCloud()">CONNECT</button>
    </div>
    <div class="cloud-note" id="cloud-note">Configura un endpoint cloud compatibile per attivare questa modalità.</div>
  </section>
  <section class="sessions-bar" aria-label="Work sessions">
    <span class="sessions-label">WORK SESSIONS</span>
    <div id="session-list"><span class="session-empty">No saved sessions</span></div>
    <button class="session-action" id="new-session" title="Create a work session">+</button>
  </section>
  <form id="session-form">
    <input id="session-title" placeholder="Title" required>
    <input id="session-topic" placeholder="Topic" required>
    <input id="session-scope" placeholder="Scope (project)" value="project">
    <textarea id="session-summary" placeholder="Briefing or context" required></textarea>
    <div class="session-form-buttons">
      <button type="button" class="btn btn-wake" id="cancel-session">CANCEL</button>
      <button type="submit" class="btn btn-send">CREATE</button>
    </div>
  </form>
  <div id="active-session"><span>Active session:</span> <strong id="active-session-title"></strong><button
      class="btn btn-wake show" id="exit-session">EXIT</button></div>
  <div class="quick-actions" aria-label="Quick commands">
    <button class="quick-action" type="button"
      onclick="quickCommand('Che cosa sta succedendo sul computer?')">STATUS</button>
    <button class="quick-action" type="button" onclick="quickCommand('Apri il browser')">OPEN BROWSER</button>
    <button class="quick-action" type="button" onclick="quickCommand('Riassumi la mia giornata')">DAILY BRIEF</button>
    <button class="quick-action" type="button" onclick='quickCommand("Cosa c' e nella mia agenda
      oggi?")'>CALENDAR</button>
  </div>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed = document.getElementById('feed');
    const pill = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake = document.getElementById('wake');
    const sessionList = document.getElementById('session-list');
    const sessionForm = document.getElementById('session-form');
    const activeSessionBar = document.getElementById('active-session');
    let _activeSession = null;
    let _workSessions = [];

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws = new WebSocket(_wsUrl);

    ws.onopen = () => { sys('Remote session active.'); toast('Connected to JARVIS'); };
    ws.onclose = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log') append(m.speaker, m.text);
      if (m.type === 'status') setStatus(m.state);
      if (m.type === 'wake') sys('Wake word detected — connecting…');
      if (m.type === 'sys') sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    // ── Work sessions ────────────────────────────────────────────────────────
    async function loadWorkSessions() {
      try {
        const res = await _authFetch('/api/work-sessions');
        if (!res.ok) throw new Error('Unable to load sessions');
        const data = await res.json();
        _workSessions = data.sessions || [];
        renderWorkSessions(_workSessions);
      } catch (_) { sessionList.innerHTML = '<span class="session-empty">Sessions unavailable</span>'; }
    }

    function renderWorkSessions(sessions) {
      sessionList.innerHTML = '';
      if (!sessions.length) {
        sessionList.innerHTML = '<span class="session-empty">No saved sessions</span>';
        return;
      }
      sessions.slice().reverse().forEach(session => {
        const button = document.createElement('button');
        button.className = 'session-item' + (_activeSession?.id === session.id ? ' active' : '');
        button.textContent = session.title || 'Untitled session';
        button.title = session.summary || session.topic || '';
        button.onclick = () => openWorkSession(session);
        sessionList.appendChild(button);
      });
    }

    async function openWorkSession(session) {
      try {
        const res = await _authFetch(`/api/work-sessions/${encodeURIComponent(session.id)}/focus`, { method: 'POST' });
        if (!res.ok) throw new Error('Unable to open session');
      } catch (error) { toast(error.message); return; }
      _activeSession = session;
      document.getElementById('active-session-title').textContent = session.title || 'Untitled session';
      activeSessionBar.classList.add('show');
      renderWorkSessions(_workSessions);
      sys(`Work session opened: ${session.title}`);
      if (session.summary) sys(session.summary);
    }

    document.getElementById('new-session').onclick = () => {
      sessionForm.classList.toggle('open');
      if (sessionForm.classList.contains('open')) document.getElementById('session-title').focus();
    };
    document.getElementById('cancel-session').onclick = () => sessionForm.classList.remove('open');
    document.getElementById('exit-session').onclick = () => {
      _activeSession = null;
      activeSessionBar.classList.remove('show');
      _authFetch('/api/work-sessions/exit', { method: 'POST' });
      loadWorkSessions();
      sys('Returned to the normal conversation.');
    };
    sessionForm.onsubmit = async (event) => {
      event.preventDefault();
      const body = {
        title: document.getElementById('session-title').value.trim(),
        topic: document.getElementById('session-topic').value.trim(),
        scope: document.getElementById('session-scope').value.trim() || 'project',
        summary: document.getElementById('session-summary').value.trim()
      };
      try {
        const res = await _authFetch('/api/work-sessions', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unable to create session');
        sessionForm.reset();
        document.getElementById('session-scope').value = 'project';
        sessionForm.classList.remove('open');
        await loadWorkSessions();
        openWorkSession(data.session);
        toast('Work session created');
      } catch (error) { toast(error.message); }
    };
    loadWorkSessions();

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Jarvis</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'heif', 'avif', 'bmp', 'svg'].includes(ext)) return '🖼️';
      if (['mp4', 'mov', 'avi', 'mkv', 'webm', 'm4v', '3gp'].includes(ext)) return '🎬';
      if (['mp3', 'm4a', 'wav', 'flac', 'aac', 'ogg', 'opus'].includes(ext)) return '🎵';
      if (['pdf'].includes(ext)) return '📋';
      if (['doc', 'docx', 'txt', 'md', 'rtf', 'odt'].includes(ext)) return '📝';
      if (['xls', 'xlsx', 'csv', 'ods'].includes(ext)) return '📊';
      if (['ppt', 'pptx', 'odp'].includes(ext)) return '📑';
      if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2', 'xz'].includes(ext)) return '📦';
      if (['apk', 'exe', 'dmg', 'deb', 'rpm', 'msi'].includes(ext)) return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st) st.textContent = pct + '%';
      };

      xhr.onload = () => {
        const bar = document.getElementById(`${id}_bar`);
        const st = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch { }
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar) { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st) { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl) lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch { }
          if (bar) bar.style.background = '#f87171';
          if (st) { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st) { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Execution modes ──────────────────────────────────────────────────────
    let _mode = localStorage.getItem('jarvis_mode') || 'local';
    const cloudEndpoint = document.getElementById('cloud-endpoint');
    const cloudToken = document.getElementById('cloud-token');
    const cloudNote = document.getElementById('cloud-note');
    cloudEndpoint.value = localStorage.getItem('jarvis_cloud_endpoint') || '';
    cloudToken.value = localStorage.getItem('jarvis_cloud_token') || '';

    function setMode(mode) {
      _mode = mode === 'cloud' ? 'cloud' : 'local';
      localStorage.setItem('jarvis_mode', _mode);
      document.body.classList.toggle('cloud-mode', _mode === 'cloud');
      document.getElementById('mode-local').classList.toggle('active', _mode === 'local');
      document.getElementById('mode-cloud').classList.toggle('active', _mode === 'cloud');
      document.getElementById('cloud-panel').classList.toggle('show', _mode === 'cloud');
      if (_mode === 'cloud') {
        encBadge.className = 'enc-badge off';
        encBadge.textContent = 'CLOUD';
        if (cloudEndpoint.value.trim()) {
          pill.className = 'pill';
          stTxt.textContent = 'Cloud ready';
          cloudNote.textContent = 'Endpoint salvato. Invia un comando per verificare la connessione.';
        } else {
          pill.className = 'pill';
          stTxt.textContent = 'Cloud setup';
          cloudNote.textContent = 'Configura un endpoint cloud compatibile per attivare questa modalità.';
        }
      } else {
        encBadge.className = _encReady ? 'enc-badge on' : 'enc-badge off';
        encBadge.textContent = _encReady ? 'AES-256' : 'NO ENC';
        setStatus(ws.readyState === WebSocket.OPEN ? 'active' : 'sleeping');
      }
    }

    function connectCloud() {
      const endpoint = cloudEndpoint.value.trim().replace(/\/$/, '');
      const token = cloudToken.value.trim();
      if (!/^https?:\/\//i.test(endpoint) || !token) {
        cloudNote.textContent = 'Inserisci un URL completo, ad esempio https://api.example.com/v1/command.';
        if (!token) cloudNote.textContent = 'Inserisci endpoint e API token per collegare Jarvis Cloud.';
        cloudEndpoint.focus();
        return;
      }
      localStorage.setItem('jarvis_cloud_endpoint', endpoint);
      localStorage.setItem('jarvis_cloud_token', token);
      cloudNote.textContent = 'Endpoint salvato. Invia un comando per verificare la connessione.';
      pill.className = 'pill on';
      stTxt.textContent = 'Cloud ready';
      toast('Cloud endpoint saved');
    }

    async function sendCloudCommand(text) {
      const endpoint = cloudEndpoint.value.trim().replace(/\/$/, '');
      const token = cloudToken.value.trim();
      if (!endpoint) {
        cloudNote.textContent = 'Inserisci prima l\'endpoint cloud.';
        document.getElementById('cloud-panel').classList.add('show');
        return;
      }
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          },
          body: JSON.stringify({ message: text, source: 'jarvis-remote', mode: 'cloud' })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Cloud error (${res.status})`);
        const reply = data.reply || data.response || data.text || data.message;
        if (reply) append('jarvis', String(reply));
        else sys('Cloud command accepted.');
        pill.className = 'pill on';
        stTxt.textContent = 'Cloud online';
      } catch (error) {
        pill.className = 'pill';
        stTxt.textContent = 'Cloud offline';
        sys(`Cloud connection failed: ${error.message}`);
      }
    }

    function quickCommand(text) {
      document.getElementById('inp').value = text;
      doSend();
    }

    cloudEndpoint.addEventListener('change', () => {
      localStorage.setItem('jarvis_cloud_endpoint', cloudEndpoint.value.trim().replace(/\/$/, ''));
    });
    cloudToken.addEventListener('change', () => {
      localStorage.setItem('jarvis_cloud_token', cloudToken.value.trim());
    });
    setMode(_mode);

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      if (_mode === 'cloud') {
        sendCloudCommand(txt);
        return;
      }
      const enc = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn = document.getElementById('mic-btn');
    let _voiceWs = null;
    let _audioCtx = null;
    let _micStm = null;
    let _audioNd = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => { });
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs = ws;
      _audioCtx = ctx;
      _micStm = stream;
    }

    function _stopVoice() {
      if (_audioNd) { try { _audioNd.disconnect(); } catch (_) { }; _audioNd = null; }
      if (_audioCtx) { try { _audioCtx.close(); } catch (_) { }; _audioCtx = null; }
      if (_micStm) { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs) {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
